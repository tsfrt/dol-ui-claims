name: Production release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require tag on main
        run: |
          git fetch origin main --depth=50
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag must point at a commit on main"; exit 1; }
      - uses: databricks/setup-cli@main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Prisma migrate production Lakebase branch
        run: |
          bash scripts/ci_lakebase.sh production
          npx --yes prisma@6.4.1 migrate deploy

      - name: Deploy production bundle
        run: |
          databricks bundle validate --target prod
          databricks bundle deploy --target prod
          databricks bundle run dol_ui_app --target prod
