[project]
name = "dol-ui-claims"
version = "0.1.0"
description = "Department of Labor unemployment claims demo on Databricks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "databricks-sdk>=0.81.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "faker>=33.0.0",
  "pytest>=8.0.0",
]
